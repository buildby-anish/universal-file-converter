name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ufc
            archive_name: ufc-x86_64-unknown-linux-gnu.tar.gz
            use_zip: false
          - os: macos-13 # Intel x86_64
            target: x86_64-apple-darwin
            binary_name: ufc
            archive_name: ufc-x86_64-apple-darwin.tar.gz
            use_zip: false
          - os: macos-latest # Apple Silicon arm64
            target: aarch64-apple-darwin
            binary_name: ufc
            archive_name: ufc-aarch64-apple-darwin.tar.gz
            use_zip: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ufc.exe
            archive_name: ufc-x86_64-pc-windows-msvc.zip
            use_zip: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Package Unix Archive
        if: ${{ !matrix.use_zip }}
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Package Windows Archive
        if: ${{ matrix.use_zip }}
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
