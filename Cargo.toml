[workspace]
resolver = "2"
members = [
    "crates/converter-core",
    "crates/converter-adapters",
    "crates/converter-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Universal File Converter Contributors"]
repository = "https://github.com/buildby-anish/universal-file-converter"

[workspace.dependencies]
thiserror = "1.0"
tempfile = "3.10"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
lopdf = "0.32"
pdf-extract = "0.7"
log = "0.4"
env_logger = "0.11"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
pulldown-cmark = "0.12"
